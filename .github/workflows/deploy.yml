name: Deploy

# Publishes main to the public site at https://oak-wildwood.github.io/cairn/.
#
# Pages serves the gh-pages branch. PR previews are a separate concern,
# handled by Vercel's GitHub integration rather than anything in this repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      # Vite emits no underscore-prefixed paths today, but Jekyll would
      # silently drop them if a future chunk name gained one.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Deploy to gh-pages root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
          commit-message: "deploy: ${{ github.sha }}"
