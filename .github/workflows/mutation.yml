name: Mutation

# Mutation testing for the unit suite (see stryker.config.mjs and AGENTS.md,
# Testing). Its own workflow so the required `verify` check in ci.yml stays
# fast, and so it isn't coupled to claude-nightly.yml, which works issues.
# Advisory: not a required status check until its runtime and flakiness are known.

on:
  # Pushes to main refresh the incremental file that PR runs restore from, but
  # only when the code under test changed: most merges leave the score alone.
  push:
    branches: [main]
    paths:
      - "src/lib/**"
      - "stryker.config.mjs"
  pull_request:
    paths:
      - "src/lib/**"
      - "stryker.config.mjs"
  schedule:
    # Weekly, for drift no path filter sees, such as a Vitest or Stryker bump.
    # Sunday 03:17 UTC, clear of the 10:00 UTC Nightly.
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 22, not the 20 that ci.yml uses: StrykerJS refuses to start below it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Stryker's incremental file: a PR run only re-tests mutants its diff
      # can affect. Saved under a per-run key and restored by prefix, so the
      # newest result from main (or this branch) seeds the next run. Restore
      # and save are split because actions/cache only saves on success, and a
      # run that falls below thresholds.break still has results worth keeping.
      - name: Restore incremental results
        uses: actions/cache/restore@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-${{ github.ref_name }}-
            stryker-incremental-main-

      - name: Mutation test
        shell: bash
        run: |
          set -o pipefail
          npm run test:mutation 2>&1 | tee stryker.log

      - name: Save incremental results
        if: always() && hashFiles('reports/stryker-incremental.json') != ''
        uses: actions/cache/save@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.ref_name }}-${{ github.run_id }}

      - name: Survivors to the job summary
        if: always()
        shell: bash
        run: |
          # npm ci or the checkout can fail before Stryker writes anything.
          [ -f stryker.log ] || { echo "No mutation run to report." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo "## Mutation testing"
            echo
            echo '```'
            # Strip ANSI color codes; the clear-text reporter lists every
            # survivor followed by the score table.
            sed -e 's/\x1b\[[0-9;]*m//g' stryker.log | grep -v ' INFO \| DEBUG ' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
